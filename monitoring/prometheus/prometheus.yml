# Ground-station scrape config (caliban). What Prometheus pulls, and how often.
#
# The scrape model (Charles's home turf): Prometheus PULLS /metrics from each target on an
# interval; each `job` is a set of targets sharing a purpose. `up{job=...}` is auto-generated
# per target (1 = last scrape ok, 0 = failed) — that's the per-node liveness signal Rung 3 leans on.

global:
  scrape_interval: 5s        # robot telemetry moves fast; 5s keeps FPS/latency graphs live
  evaluation_interval: 15s

scrape_configs:
  # Self-scrape: proves the stack is alive before any vehicle target exists (first light).
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # VEHICLE host metrics (node-exporter on hyperion). DOWN until exporters.compose.yml runs
  # on the Jetson — the red→green flip is Rung 0's end-to-end proof of the cross-host scrape.
  # "hyperion" resolves via extra_hosts in docker-compose.yml → 10.0.0.64.
  - job_name: hyperion-node
    static_configs:
      - targets: ["hyperion:9100"]
        labels:
          host: hyperion
          role: vehicle

  # VEHICLE tegra hardware (Rung 2): GPU load, thermal zones, ina3221 power rails (W).
  # jetson-exporter on hyperion (:9809), via the host jtop.service. DOWN unless it's running there.
  - job_name: jetson
    static_configs:
      - targets: ["hyperion:9809"]
        labels:
          host: hyperion
          role: vehicle

  # (Rung 3 cAdvisor job removed — cAdvisor is incompatible with the vehicle's Docker 29 overlayfs
  # containerd-snapshotter store; per-node liveness comes from up{job=...} on the jobs below.)

  # APP metrics from the detector node (Rung 1): inference latency, FPS, end-to-end latency.
  # The node's own prometheus_client endpoint (:9808 on hyperion, host network via bringup).
  # DOWN unless the perception graph is running (docker compose up bringup) — so this target's
  # up/down doubles as "is the detector alive?", the Rung 3 kill-a-node signal.
  - job_name: detector
    static_configs:
      - targets: ["hyperion:9808"]
        labels:
          host: hyperion
          role: vehicle
          node: yolo_detector

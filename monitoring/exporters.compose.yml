# Fleet monitoring — VEHICLE exporters (runs on hyperion, the Jetson).
#
# The robot side of the ground-station topology: these containers only EXPOSE /metrics on the
# vehicle's host ports; caliban's Prometheus reaches across the LAN and scrapes them. Nothing
# here stores or graphs — that's the ground station's job.
#
# Bring up ON HYPERION:
#   docker compose -f monitoring/exporters.compose.yml up -d
#   verify locally:  curl -s localhost:9100/metrics | head
# Then on caliban, Prometheus target hyperion-node flips DOWN→UP within one scrape (5s).
#
# Grows across the M6 rungs: Rung 2 adds a Jetson tegra/power exporter; Rung 3 adds cAdvisor.

services:
  # Rung 0: standard host metrics — CPU, memory, disk, network, filesystem.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: fleet-node-exporter
    restart: unless-stopped
    network_mode: host          # bind :9100 on the HOST so caliban can scrape hyperion:9100
    pid: host                   # see host processes, not just the container's
    command:
      - '--path.rootfs=/host'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      # Jetson gotcha: node-exporter's DEFAULT collector set includes tegra hardware collectors
      # (hwmon/thermal_zone/rapl/powersupplyclass) that HANG reading the Orin's /sys — each
      # /metrics request blocks forever, requests pile up to node-exporter's 40-concurrent cap,
      # then every scrape gets "503 concurrent requests reached" and Prometheus times out.
      # Fix: disable defaults and whitelist only the generic host collectors. Tegra GPU/power/
      # thermal rails are Rung 2's job (a dedicated jetson-stats exporter), not this one.
      - '--collector.disable-defaults'
      - '--collector.cpu'
      - '--collector.meminfo'
      - '--collector.loadavg'
      - '--collector.stat'          # boot time, context switches, forks
      - '--collector.vmstat'
      - '--collector.diskstats'     # disk I/O (bags hammer storage)
      - '--collector.netdev'        # per-interface throughput
      - '--collector.uname'         # node_uname_info — handy dashboard label
      - '--collector.time'          # node_time_seconds — clock/skew sanity
      - '--collector.filesystem'    # disk free — bags fill the eMMC; watch it
      # ignore container/virtual filesystems so disk metrics reflect the real Jetson storage
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /:/host:ro,rslave       # read-only view of the host's /, /proc, /sys for real metrics

  # Rung 2: Jetson tegra metrics — GPU load, thermal zones, and the ina3221 POWER RAILS (W).
  # The robotics-new signal node-exporter can't provide (and whose tegra /sys hangs its collectors).
  # Reads via jetson-stats' jtop client, which talks to the host jtop.service over /run/jtop.sock.
  jetson-exporter:
    build: ./jetson-exporter
    image: fleet-jetson-exporter:latest
    container_name: fleet-jetson-exporter
    restart: unless-stopped
    network_mode: host          # expose :9809 on the HOST so caliban scrapes hyperion:9809
    volumes:
      # The host jtop.service owns the tegra sensors and publishes them on this socket; the client
      # in here connects to it. Socket is root:jtop 0660 and the container runs as root (owner) -> ok.
      - /run/jtop.sock:/run/jtop.sock

  # Rung 3 note — per-container CPU/mem was planned via cAdvisor, but cAdvisor is INCOMPATIBLE with
  # this host's Docker 29 storage driver ("overlayfs" = the containerd-snapshotter image store):
  # it hard-codes a lookup into /var/lib/docker/image/overlay2/layerdb/mounts/<id>/mount-id, which
  # doesn't exist under the snapshotter, so it aborts every container and reports only the root
  # cgroup. Not worth downgrading the host storage driver for a nice-to-have. Rung 3's DoD — per-node
  # liveness + the kill-a-node demo — is delivered by Prometheus `up{job=...}` (0 when a node's
  # /metrics disappears); host CPU/mem is covered by node-exporter above. See state/decisions.md.

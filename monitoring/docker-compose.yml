# Fleet monitoring — GROUND STATION stack (runs on caliban, the 10.0.0.29 workstation).
#
# Topology (M6 Rung 0 decision — the prod/fleet-shaped fork):
#   the VEHICLE (hyperion) only *emits* metrics (see exporters.compose.yml, run THERE);
#   the GROUND STATION (caliban) *scrapes* + *visualizes* them (this file, run HERE).
# The robot never spends CPU/RAM on Prometheus/Grafana — it just exposes exporters.
#
# Bring up on caliban:
#   docker compose -f monitoring/docker-compose.yml up -d
#   Grafana  → http://10.0.0.29:3000   (admin / admin on first login)
#   Prometheus → http://10.0.0.29:9090  (Status → Targets to see up/down)
#
# The hyperion:9100 scrape target stays DOWN (red) until node-exporter is running on the
# vehicle — that red→green flip is the first end-to-end proof the ground-station scrape works.

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: fleet-prometheus
    restart: unless-stopped
    # Resolve the vehicle's hostname to its LAN IP INSIDE the container. Prometheus uses
    # Docker's DNS, which doesn't know "hyperion"; without this the scrape config would have
    # to hard-code 10.0.0.64. Keeps prometheus.yml readable and host-agnostic.
    extra_hosts:
      - "hyperion:10.0.0.64"
    volumes:
      # Mount the DIRECTORY, not the single file: an editor's atomic-rename swaps the file's inode,
      # and a single-file bind mount keeps pointing at the STALE inode (POST /-/reload then reads old
      # config). Mounting the dir means the filename is re-resolved on each read, so editing
      # prometheus.yml + `curl -X POST /-/reload` picks up changes with no container recreate.
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'   # ground station keeps 15 days of history
      - '--web.enable-lifecycle'               # POST /-/reload to hot-reload the scrape config
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.4.0
    container_name: fleet-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      # Datasource + dashboards are PROVISIONED FROM THE REPO (infra-as-code, not click-ops).
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  prometheus-data:
  grafana-data:

; ESP32-S3 motor + IMU node for the Devastator (Phase 2).
; Board: Freenove ESP32-S3-WROOM (N8R8), onboard camera removed.
; Flash + console over the NATIVE USB port; micro-ROS will later use the UART-bridge port.

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 8MB
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit BNO055
    adafruit/Adafruit Unified Sensor
